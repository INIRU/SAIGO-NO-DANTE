# /etc/systemd/system/saigo-web.service.d/standalone.conf
# The app folder holds the standalone output (server.js). An older folder restored by a rollback may still be a full
# next build, so that case keeps running `next start`. The env file is read by systemd as well because server.js is
# not guaranteed to load .env files.
[Service]
EnvironmentFile=/home/ubuntu/saigo/env.production
Environment=HOSTNAME=127.0.0.1
Environment=PORT=3000
ExecStart=
ExecStart=/bin/sh -c 'if [ -f server.js ]; then exec /usr/bin/node server.js; else exec /usr/bin/node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3000; fi'
