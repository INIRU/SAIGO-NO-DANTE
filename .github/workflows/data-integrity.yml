name: Data integrity

# Checks production game data every day: gift/theme/recipe/event references, image URLs,
# en/ja names and affiliation translations. Also runs when the sync or audit scripts change.
on:
  schedule:
    - cron: '0 21 * * *' # 06:00 KST
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync/**'
      - 'scripts/audit/**'
      - 'lib/i18n/localize.ts'

jobs:
  audit:
    name: Data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run audit:data
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
